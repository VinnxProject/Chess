<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vines Chess Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1>Vines Chess Analysis</h1>
        </header>

        <div class="content-wrapper">
            <!-- Sisi Kiri: Papan Catur -->
            <div class="board-section">
                <div class="board-wrapper">
                    <!-- Layer Panah (SVG) -->
                    <svg id="arrow-layer" viewBox="0 0 480 480" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></svg>
                    <!-- Papan Catur -->
                    <div id="board" class="board"></div>
                </div>
            </div>

            <!-- Sisi Kanan: Panel Analisis -->
            <div class="sidebar">
                <div class="engine-panel">
                    <h3>Evaluasi</h3>
                    <div id="evaluation">0.00</div>
                    <h3>Langkah Terbaik</h3>
                    <div id="best-move">-</div>
                    <h3>Variasi (PV)</h3>
                    <div id="principal-variation">-</div>
                </div>

                <div class="controls-panel">
                    <div class="mode-selector">
                        <button class="mode-btn active" data-depth="22" onclick="setMode(this)">🔥 Ekstrim</button>
                        <button class="mode-btn" data-depth="18" onclick="setMode(this)">🧠 Bijak</button>
                        <button class="mode-btn" data-depth="12" onclick="setMode(this)">⚡ Normal</button>
                    </div>
                    <button id="reset-btn">🔄 Reset Papan</button>
                    <button id="flip-btn">🔃 Putar Papan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="stockfish-19-asm.js"></script>
    <script src="script.js"></script>
</body>
</html>
