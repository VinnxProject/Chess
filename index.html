<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101318">

    <title>Vines Chess Analysis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-container">

        <header class="header">
            <div>
                <h1>VINES CHESS</h1>
                <p style="color:#8994a5;font-size:12px;margin-top:6px;">
                    Chess Analysis Engine
                </p>
            </div>
        </header>

        <div class="content-wrapper">

            <!-- CHESS BOARD -->

            <section class="board-section">

                <div class="board-wrapper">

                    <svg
                        id="arrow-layer"
                        viewBox="0 0 480 480"
                        preserveAspectRatio="none"
                        style="
                            position:absolute;
                            inset:0;
                            width:100%;
                            height:100%;
                            pointer-events:none;
                            z-index:10;
                        ">
                    </svg>

                    <div id="board" class="board"></div>

                </div>

            </section>

            <!-- ANALYSIS SIDEBAR -->

            <aside class="sidebar">

                <section class="engine-panel">

                    <h3>Engine Evaluation</h3>

                    <div id="evaluation">0.00</div>

                    <div style="
                        height:4px;
                        background:#303b4b;
                        border-radius:10px;
                        margin-top:12px;
                        overflow:hidden;
                    ">
                        <div style="
                            width:50%;
                            height:100%;
                            background:#81b64c;
                            border-radius:10px;
                        "></div>
                    </div>

                    <h3>Best Move</h3>

                    <div id="best-move">-</div>

                    <h3>Principal Variation</h3>

                    <div id="principal-variation">-</div>

                </section>

                <!-- ENGINE CONTROLS -->

                <section class="controls-panel">

                    <div style="
                        color:#8994a5;
                        font-size:10px;
                        font-weight:800;
                        letter-spacing:1.5px;
                        margin-bottom:2px;
                    ">
                        ENGINE STRENGTH
                    </div>

                    <div class="mode-selector">

                        <button
                            class="mode-btn active"
                            data-depth="22"
                            onclick="setMode(this)">
                            Ekstrim
                        </button>

                        <button
                            class="mode-btn"
                            data-depth="18"
                            onclick="setMode(this)">
                            Bijak
                        </button>

                        <button
                            class="mode-btn"
                            data-depth="12"
                            onclick="setMode(this)">
                            Normal
                        </button>

                    </div>

                    <div style="
                        height:1px;
                        background:#2b3442;
                        margin:5px 0;
                    "></div>

                    <button id="reset-btn">
                        Reset Papan
                    </button>

                    <button id="flip-btn">
                        Putar Papan
                    </button>

                </section>

                <footer style="
                    text-align:center;
                    color:#657184;
                    font-size:10px;
                    padding:5px;
                ">
                    Vines Chess Analysis · Powered by Stockfish
                </footer>

            </aside>

        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="stockfish-19-asm.js"></script>
    <script src="script.js"></script>

</body>
</html>
